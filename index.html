<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>استقصاء الرضا الوظيفي لأعضاء هيئة التدريس 2026-2027</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1c2733;--mute:#5d6b7a;--line:#d9e0e8;--brand:#1f4e79;--brand-ink:#fff;--sel:#e3eefa;--ok:#2e7d32;--err:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171d;--card:#1b232c;--ink:#e8edf2;--mute:#9aa8b6;--line:#2f3b47;--brand:#6fa8dc;--brand-ink:#0c1620;--sel:#22364a;--ok:#66bb6a;--err:#ef6f62;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12171d;--card:#1b232c;--ink:#e8edf2;--mute:#9aa8b6;--line:#2f3b47;--brand:#6fa8dc;--brand-ink:#0c1620;--sel:#22364a;--ok:#66bb6a;--err:#ef6f62;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,"Segoe UI","Noto Naskh Arabic",Arial,sans-serif;line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header{text-align:center;padding:18px 8px 8px}
header small{color:var(--mute)}
h1{font-size:1.35rem;margin:.2rem 0;color:var(--brand)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0}
.tabs{display:flex;gap:8px;justify-content:center;margin-top:10px}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 16px;border-radius:20px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
label.f{display:block;font-weight:700;margin-bottom:4px}
select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px}
textarea{min-height:110px;resize:vertical}
.q{padding:12px 0;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.q p{margin:0 0 8px;font-weight:600}
.q .n{display:inline-block;min-width:1.8em;color:var(--brand)}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts label{flex:1;min-width:88px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:7px 4px;cursor:pointer;background:var(--bg)}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts label.on{background:var(--sel);border-color:var(--brand);color:var(--brand);font-weight:700}
.q.bad{outline:2px solid var(--err);outline-offset:2px;border-radius:8px}
button.main{width:100%;padding:12px;border:0;border-radius:10px;background:var(--brand);color:var(--brand-ink);font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer}
button.main:disabled{opacity:.5}
.msg{padding:10px 12px;border-radius:8px;margin:10px 0}
.msg.err{background:color-mix(in srgb,var(--err) 14%,transparent);color:var(--err)}
.msg.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.note{color:var(--mute);font-size:.88rem}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:.92rem}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:center}
th{background:var(--brand);color:var(--brand-ink)}
td.t{text-align:right}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;display:flex;margin-top:4px}
.bar i{display:block;height:100%}
.op{padding:8px 10px;border-right:3px solid var(--brand);background:var(--bg);margin:8px 0;border-radius:6px;white-space:pre-wrap}
.hidden{display:none}
.logos{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}.logos img{height:72px;width:auto;background:#fff;border-radius:10px;padding:5px;border:1px solid var(--line)}@media(max-width:560px){.logos img{height:56px}}</style>
</head>

  <h1>استقصاء الرضا الوظيفي لأعضاء هيئة التدريس</h1>
  <div>للعام الجامعي 2026-2027م</div>
</header>

<section id="formView">
  <div class="card note">يسعدنا مشاركتكم برأيكم الكريم، ونؤكد أن إجاباتكم مجهولة الهوية وتُستخدم لأغراض التطوير فقط.</div>
  <div id="status"></div>
  <form id="f" onsubmit="return false">
    <div class="card row">
      <div><label class="f" for="dept">القسم</label>
        <select id="dept"><option value="">اختر القسم…</option>
          <option>الرياضيات والإحصاء وعلوم الحاسب</option><option>الفيزياء</option><option>الكيمياء</option>
          <option>الجيولوجيا</option><option>علم الحيوان</option><option>النبات والميكروبيولوجي</option>
        </select></div>
      <div><label class="f" for="rank">الدرجة العلمية</label>
        <select id="rank"><option value="">اختر الدرجة…</option>
          <option>أستاذ</option><option>أستاذ مساعد</option><option>مدرس</option><option>مدرس مساعد</option><option>معيد</option>
        </select></div>
    </div>
    <div class="card" id="qs"></div>
    <div class="card">
      <label class="f" for="other">آراء أخرى</label>
      <textarea id="other" placeholder="اكتب أي ملاحظات أو مقترحات (اختياري)"></textarea>
    </div>
    <div id="err"></div>
    <button class="main" id="send" type="button">إرسال الاستبيان</button>
  </form>
</section>

</div>

<script>
// ====== ضع هنا رابط تطبيق الويب (Web app URL) الناتج من Google Apps Script ======
var SCRIPT_URL="https://script.google.com/macros/s/AKfycbyoRablEHlHw9SLdvpRUFMVQjDRE-1pIfWwkqK5uSgHZldRm_pheBRdhwQz7yCWklI/exec";
// =================================================================================
var Q=["لا يوجد ما يعيق مشاركتك في اتخاذ القرارات بالقسم","هل الأعباء التدريسية مناسبة","إذا وجدت مشكلة ما هل تجد العون الكافي من إدارة القسم لحلها","هل قرارات مجلس القسم دائماً ذات فاعلية","هل تشارك في اللجان المنبثقة عن مجلس القسم","أتجد الدعم المالي للبحث العلمي مناسباً لطبيعة الأبحاث","أأنت راضٍ عن نظام الترقيات الحالي","هل شاركت في برامج تنمية قدرات أعضاء هيئة التدريس كمتدرب","أتجد صعوبة في التواجد المستمر بمكتبك لعدم وجود التجهيزات المناسبة","أترى هناك عدالة في توزيع الإشراف على الرسائل العلمية","هل ترى لوحدة ضمان الجودة بالكلية فاعلية في الأداء","لا توجد صعوبة لإبداء رأيك عند اتخاذ القرارات بمجلس القسم","هل تقوم بتدريس المقررات المناسبة من حيث التخصص وعدد الساعات","هل تضطر دائماً إلى اللجوء لقيادة الكلية لحل المشاكل","هل أنت راضٍ عن أداء مجلس القسم","هل تستطيع توفير دعم مالي لإجراء الأبحاث بطريقتك الخاصة","أترى فاعلية لدورات التدريب الخاصة بتنمية قدرات أعضاء هيئة التدريس","هل أنت راضٍ عن نظام توزيع طلاب الدراسات العليا على المشرفين","هل قمت بإعداد توصيف وتقرير المقررات التي تقوم بتدريسها"];
var $=function(i){return document.getElementById(i)};
var ans=new Array(Q.length).fill(-1);
var KEY="faculty_survey_2026_submitted";

(function build(){
  var h="";
  Q.forEach(function(q,i){
    h+='<div class="q" id="q'+i+'"><p><span class="n">'+(i+1)+'.</span>'+q+'</p><div class="opts">';
    ["نعم","إلى حد ما","لا"].forEach(function(o,j){h+='<label data-i="'+i+'" data-j="'+j+'"><input type="radio" name="r'+i+'">'+o+'</label>'});
    h+='</div></div>';
  });
  $("qs").innerHTML=h;
  $("qs").addEventListener("click",function(e){
    var l=e.target.closest("label[data-i]"); if(!l) return;
    var i=+l.dataset.i; ans[i]=+l.dataset.j;
    l.parentNode.querySelectorAll("label").forEach(function(x){x.classList.toggle("on",x===l)});
    $("q"+i).classList.remove("bad");
  });
})();

function msg(el,cls,t){$(el).innerHTML=t?'<div class="msg '+cls+'">'+t+'</div>':""}
function done(t){$("f").classList.add("hidden");msg("status","ok",t)}
try{if(localStorage.getItem(KEY))done("سبق أن أرسلت إجابتك من هذا الجهاز. شكراً لك.")}catch(e){}

$("send").onclick=async function(){
  msg("err","","");
  var bad=[];ans.forEach(function(a,i){if(a<0)bad.push(i)});
  bad.forEach(function(i){$("q"+i).classList.add("bad")});
  if(!$("dept").value||!$("rank").value||bad.length){
    msg("err","err","من فضلك أكمل القسم والدرجة العلمية وأجب عن جميع العبارات"+(bad.length?" (المتبقي: "+bad.length+")":"")+".");
    if(bad.length)$("q"+bad[0]).scrollIntoView({behavior:"smooth",block:"center"});
    return;
  }
  if(SCRIPT_URL.indexOf("http")!==0){msg("err","err","لم يُضبط رابط الربط بعد (SCRIPT_URL).");return}
  $("send").disabled=true;
  try{
    await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({dept:$("dept").value,rank:$("rank").value,answers:ans,other:$("other").value.trim()})});
    try{localStorage.setItem(KEY,"1")}catch(e){}
    done("تم استلام إجابتك بنجاح. شكراً لمشاركتك.");
    window.scrollTo({top:0,behavior:"smooth"});
  }catch(e){
    $("send").disabled=false;
    msg("err","err","تعذّر الإرسال، تأكد من الاتصال بالإنترنت وأعد المحاولة.");
  }
};
</script>
